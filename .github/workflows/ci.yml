---
name: CI

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt

      # Pure Rust (native ARM64 interpreter): no C toolchain needed.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Install quality tools
        run: |
          cargo install --locked cargo-license --version 0.7.0
          cargo install --locked cargo-machete --version 0.9.2
          cargo install --locked cargo-audit --version 0.22.0
          cargo install --locked cargo-deny --version 0.19.4

      - name: Check unused dependencies
        run: cargo machete

      - name: Audit dependencies
        run: cargo audit

      - name: Check dependency policy
        run: cargo deny check

      # License report of the default (MIT, native-backend) build.
      - name: Export dependency licenses
        run: >-
          mkdir -p target/reports && cargo license --json
          --output target/reports/cargo-license.json

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('target/reports/cargo-license.json') != ''
        with:
          name: cargo-license-report
          path: target/reports/cargo-license.json
          if-no-files-found: error

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      # Pure Rust: no C toolchain or external engine needed.
      - name: Tests
        run: cargo test --all --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install cargo-tarpaulin
        run: cargo install --locked cargo-tarpaulin --version 0.37.6

      # The native interpreter's differential tests compare it against
      # Unicorn results frozen in tests/fixtures/native_oracle/, so coverage
      # needs no external engine.
      - name: Enforce coverage threshold
        run: cargo tarpaulin --workspace --locked --out xml

  unused-dependencies:
    name: cargo-udeps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly

      - name: Install cargo-udeps
        run: cargo install --locked cargo-udeps --version 0.1.61

      - name: Find unused dependencies
        run: cargo +nightly udeps --workspace --all-targets --locked

  sbom-quality:
    name: SBOM quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # v1.2.0
      # yamllint disable rule:line-length
      - uses: sbom-tool/sbom-tools-action@c73f5ccd0e22e0797e1647d8abd57ba59e407472
        # yamllint enable rule:line-length
        name: Comprehensive SBOM assessment
        with:
          version: 0.4.0
          command: quality
          profile: comprehensive
          min-score: 85
          args: sbom/ipakeep.cdx.json

      - name: Standard SBOM grade gate
        uses: sbom-tool/sbom-tools-action@c73f5ccd0e22e0797e1647d8abd57ba59e407472
        with:
          version: 0.4.0
          command: quality
          profile: standard
          min-score: 90
          args: sbom/ipakeep.cdx.json

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Sign SBOM with Sigstore keyless
        run: cosign sign-blob --yes --bundle sbom/ipakeep.cdx.json.sigstore.json sbom/ipakeep.cdx.json

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Verify SBOM signature
        run: >-
          cosign verify-blob sbom/ipakeep.cdx.json
          --bundle sbom/ipakeep.cdx.json.sigstore.json
          --certificate-identity-regexp '^https://github.com/seifreed/ipakeep/.github/workflows/ci.yml@refs/heads/main$'
          --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: signed-sbom
          path: |
            sbom/ipakeep.cdx.json
            sbom/ipakeep.cdx.json.sigstore.json
          if-no-files-found: error
