[report]
# LLVM source-based coverage on every OS. Linux's default ptrace engine
# mis-attributes struct-literal fields, `.mem` chain lines and bare
# `break`/`continue` (99.87% there vs 100% under LLVM on macOS).
engine = "Llvm"
out = ["Stdout", "Json"]
output-dir = "target/tarpaulin"

[coverage]
# The engine must also be set here: tarpaulin traces each named table except
# `[report]`, and its Linux default is Ptrace (see the note above).
engine = "Llvm"
fail-under = 100
workspace = true

# Boundary adapters depend on Apple services, the pinned Apple assets, the
# emulated Apple guest, Keychain, Xcode simctl, Apple codesign, or
# process-level CLI dispatch. They are covered by integration/smoke tests where
# practical; line coverage here is measured for deterministic core code.
exclude-files = [
  "src/main.rs",
  "src/infrastructure/apple_sap/assets/bundle.rs",
  "src/infrastructure/apple_sap/assets/http_range.rs",
  "src/infrastructure/apple_sap/assets/remote.rs",
  "src/infrastructure/apple_sap/machine/kbsync.rs",
  "src/infrastructure/apple_sap/machine/modern_adi.rs",
  "src/infrastructure/apple_sap/machine/sap.rs",
  "src/infrastructure/apple_sap/machine/storeagent.rs",
  "src/infrastructure/apple_sap/signer.rs",
  "src/infrastructure/apple_sap/storeauth/service.rs",
  "src/infrastructure/apple_sap/storeauth/worker.rs",
  "src/infrastructure/appstore/store_api/store_machine.rs",
  "src/infrastructure/appstore/store_api/store_session.rs",
  "src/infrastructure/decrypt/codesign.rs",
  "src/presentation/cli/**",
  "src/domain/repository/fake/**",
  "src/domain/usecase/auth_login.rs",
  "src/infrastructure/appstore/store_api/grandslam_auth.rs",
  "src/infrastructure/appstore/store_api.rs",
  "src/infrastructure/appstore/store_api/parsing.rs",
  "src/infrastructure/appstore/storefront.rs",
