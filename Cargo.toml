[package]
name = "ipakeep"
version = "0.1.1"
edition = "2024"
description = "Download IPA files from the Apple App Store"
license = "MIT"
repository = "https://github.com/seifreed/ipakeep"

[[bin]]
name = "ipakeep"
path = "src/main.rs"

[lib]
name = "ipakeep"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "io-std", "io-util"] }
async-trait = "0.1"

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "cookies", "json", "form"] }
# Pure-Rust TLS for reqwest on every platform, using the `ring` crypto provider
# (installed by `infrastructure::http::client_builder`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Persistent Store session cookie jar (`store-cookies.json`).
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
# cookie 0.18.1 does not compile with time 0.3.52; cargo install resolves
# without this crate's lockfile, so keep the transitive version bounded.
time = "=0.3.47"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# IPA manipulation — Apple IPAs only use Stored/Deflated; disabling the other
# codecs (bzip2, lzma, zstd, xz, ppmd, aes-crypto) trims the transitive surface.
zip = { version = "9.3", default-features = false, features = ["deflate"] }

# Interactive prompts
dialoguer = "0.12"

# Misc
base64 = "0.22"
mac_address = "1"
dirs = "6"
libc = "0.2"
md5 = "0.8"
hex = "0.4"

# Cryptography (for GrandSlam SRP auth)
srp = "0.6"
num-bigint = "0.4"
rand = "0.10"
aes = "0.8"
aes-gcm = "0.10.3"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"

# Native Apple SAP/ADI (port of ipatool's emulated Store stack)
lzfse_rust = "0.2"
p256 = { version = "0.14", features = ["ecdh", "pem", "pkcs8"] }
ctr = "0.9"
hkdf = "0.12"
unicorn-engine = { version = "2.1", default-features = false, features = ["arch_aarch64"] }

# Developer certificate request (RSA-2048 key + PKCS#10 CSR)
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
x509-cert = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
mockall = "0.15.0"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
assert_cmd = "2"
predicates = "3"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
